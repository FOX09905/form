<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="utf-8">
     <meta 
     name="viewport" 
     content="width=device-width, initial-scale=1.0">
    <title>freeCodeCamp アンケートフォーム</title>
    <link rel="stylesheet" href="style.css">
  </head>

  <body>
      <h1 id="title">
        freeCodeCamp アンケートフォーム
        </h1>
      <p id="description">
        プラットフォーム改善のためにご協力いただきありがとうございます
      </p> 

    <form id="survey-form">
      <label for="name" id="name-label">
        名前
        <input 
        id="name" 
        name="name" 
        type="text" 
        placeholder="山田 太郎" 
        required>
      </label>
      
      <label for="email" id="email-label">
        メールアドレス
        <input 
        id="email" 
        name="mail" 
        type="email" 
        placeholder="@gmail.com" 
        required>
      </label>
      
      <label for="number" id="number-label">年齢
        <input 
        id="number" 
        name="number" 
        type="number" 
        min="10" 
        max="100" 
        placeholder="任意">
      </label>

      <label for="dropdown">現在の職業を選んでください
        <select 
        id="dropdown"
        name="role">
        <option
        value="" disabled selected>選択する</option>
        <option>学生</option>
        <option>会社員</option>
        <option>経営者</option>
        <option>公務員</option>
        <option>教職員</option>
        <option>医療関係者</option>
        <option>自営業・自由業</option>
        <option>パート・アルバイト</option>
        <option>専業主婦(夫)</option>
        <option>無職・求職中</option>
        </select>
      </label>
      
      <div class="radio">
      <p>freeCodeCampを友人に紹介したいと思いますか？</p>

        <label class="radio-label">
        <input 
        name="recommend" 
        type="radio" 
        value="1" 
        required>はい
        </label>

        <label class="radio-label">
        <input
          name="recommend" 
          type="radio" 
          value="2" 
          required>いいえ
          </label>

        <label class="radio-label">
        <input 
        name="recommend" 
        type="radio" 
        value="3" 
        required>わからない
        </label>
      </div>
      
      <label for="select">freeCodeCampでは何のコースを勉強しましたか？
      <select>
        <option
        value="" disabled selected>選択する
        <option>レスポンシブウェブデザイン</option>
        <option>JavaScript</option>
        <option>フロントエンド開発ライブラリ</option>
        <option>データ可視化</option>
        <option>リレーショナルデータベース</option>
        <option>バックエンド開発とAPI</option>
     　 <option>品質保証</option>
      </select>  
      </label>

    <div class="check">
      <p>改善してほしい点はありますか？（複数選択可）
      </p>
      <label class="check-box">
           <input 
           type="checkbox" 
           name="improved" 
           value="1">フロントエンドプロジェクト
      </label>

      <label class="check-box">
           <input 
           type="checkbox" 
           name="improved" 
           value="2">バックエンドプロジェクト
      </label>

      <label class="check-box">
           <input 
           type="checkbox" 
           name="improved" 
           value="3">データ可視化
      </label>

      <label class="check-box">
          <input 
          type="checkbox" 
          name="improved" 
          value="4">チャレンジ
      </label>

      <label class="check-box">
          <input 
          type="checkbox" 
          name="improved" 
          value="5">オープンソースコミュニティ
      </label>

      <label class="check-box">
          <input 
          type="checkbox" 
          name="improved" 
          value="6">Challenges
      </label>

      <label class="check-box">
          <input 
          type="checkbox" 
          name="improved" 
          value="7">フォーラム
      </label>

      <label class="check-box">
          <input 
          type="checkbox" 
          name="improved" 
          value="8">動画
      </label>

      <label class="check-box">
          <input 
          type="checkbox" 
          name="improved" 
          value="9">Gitterのヘルプルーム
      </label>

      <label class="check-box">
          <input 
          type="checkbox" 
          name="improved" 
          value="10">送信機能
      </label> 

    </div>  

    <div class="text">
      <p>ご意見・ご感想があればご記入ください</p>
      <textarea 
      id="any" 
      name="any"
      required>
      </textarea>
    </div>


    <input 
       type="submit" 
       value="送信する" 
       id="submit">

     </form>

       
  </body>


</html>
